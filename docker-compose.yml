services:
  redis:
    image: redis:7-alpine
    container_name: claimguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: claimguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HuggingFace Text-Embeddings-Inference server hosting jina-embeddings-v3
  # (ADR-0003). Currently behind the `embeddings` profile because TEI lacks
  # a linux/arm64 image — on Apple Silicon we either emulate via Rosetta or
  # fall back to in-process sentence-transformers in the API. We only need
  # this once PROJ-9 (Retrieval) starts indexing into Qdrant.
  #
  # Start explicitly: `docker compose --profile embeddings up -d`
  embeddings:
    profiles: ["embeddings"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    platform: linux/amd64
    container_name: claimguard-embeddings
    ports:
      - "8080:80"
    command: ["--model-id", "jinaai/jina-embeddings-v3", "--max-batch-tokens", "16384"]
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    volumes:
      - embeddings-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  embeddings-cache:
