services:
  redis:
    image: redis:7-alpine
    container_name: claimguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: claimguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Postgres dient zwei Zwecken:
  # 1. PROJ-9 Hybrid-Retrieval: tsvector('german', …) als zweite Quelle
  #    neben Qdrant, damit Schlüsselwort-Treffer (z. B. "Apotheker",
  #    "Nebenwirkungen") greifen, die das Embedding semantisch verfehlt.
  # 2. später: persistierte Analyseergebnisse + Auth (PROJ-1/2/3) - dann
  #    wird in Produktion auf Supabase Postgres gewechselt, lokal bleibt
  #    der Container.
  postgres:
    image: postgres:16-alpine
    container_name: claimguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard
      POSTGRES_DB: claimguard
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Embeddings laufen seit ADR-0006 in-process im FastAPI-Prozess
  # (sentence-transformers, multilingual-e5-base). Deshalb gibt es hier
  # keinen separaten Embedding-Container mehr.

volumes:
  redis-data:
  qdrant-data:
  postgres-data:
