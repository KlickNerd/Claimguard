[project]
name = "claimguard-api"
version = "0.1.0"
description = "ClaimGuard Analysis API – Claim-Detection, Retrieval, Evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.39.0",
    "supabase>=2.10.0",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "langdetect>=1.0.9",
    "bleach>=6.2.0",
    "ftfy>=6.3.0",
    "jinja2>=3.1.4",
    "python-frontmatter>=1.1.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "stripe>=11.2.0",
    "unstructured[pdf]>=0.16.0",
    "playwright>=1.48.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.3.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
